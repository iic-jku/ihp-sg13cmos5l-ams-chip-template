meta:
  version: 3
  flow: Chip
  substituting_steps:

    # Magic reports some overlaps which can be ignored
    Checker.IllegalOverlap: null

    # Disable KLayout DRC
    #KLayout.DRC: null
    #Checker.KLayoutDRC: null

    # Disable Magic DRC
    #Magic.DRC: null
    #Checker.MagicDRC: null

    # Disable KLayout antenna check
    #KLayout.Antenna: null
    #Checker.KLayoutAntenna: null

    # Disable KLayout density check
    #KLayout.Density: null
    #Checker.KLayoutDensity: null

    # Save time
    #OpenROAD.IRDropReport: null
    #KLayout.XOR: null
    #Netgen.LVS: null
    #Checker.LVS: null

    # Use Magic.Filler instead of KLayout.Filler
    # This can help in some cases where the target
    # density cannot be met using KLayout.
    #KLayout.Filler: Magic.Filler

    # Disable KLayout filler (all layers)
    # TODO: add custom LibreLane step for filler insertion after ArtistIC added logo.
    KLayout.Filler: null

    # TODO: Add GDSFill

    # Disable setup-violation errors
    #Checker.SetupViolations: null

    # Fix hold violations by inserting buffers
    #"+OpenROAD.DetailedRouting": "Odb.InsertECOBuffers"
    #"+Odb.InsertECOBuffers": "OpenROAD.DetailedRouting"


# INSERT_ECO_BUFFERS:
#  - target: rst_n_pad/Y
#    buffer: sg13cmos5l_buf_4

DESIGN_NAME: chip_top
VERILOG_FILES:
- dir::../../rtl/chip_top.sv
- dir::../../rtl/chip_core.sv

VERILOG_DEFINES: [FUNCTIONAL]

# Enable plugin for better SystemVerilog support
# USE_SLANG: True
# SLANG_ARGUMENTS: ['--keep-hierarchy']

# The sg13cmos5l PDK already defaults to KLayout for GDS streamout
# PRIMARY_GDSII_STREAMOUT_TOOL: klayout

# ================================================================
# Padframe layout: 8 pads per side, 32 user bondpads in total.
# Order convention:
#   - PAD_WEST  : bottom to top
#   - PAD_EAST  : bottom to top
#   - PAD_NORTH : left   to right
#   - PAD_SOUTH : left   to right
# Pad-cell instance names follow the generate-block hierarchy in
# rtl/chip_top.sv (e.g. "g_outputs[7].output_pad").
# See doc/pinout.md for the full pin table.
# ================================================================

# West (bottom to top): VSS, VDD, IOVSS, IOVDD, sel[0], sel[1], rst_n, clk
PAD_WEST: [
    "g_vss_pads\\[0\\].vss_pad",        # VSS  (core ground)
    "g_vdd_pads\\[0\\].vdd_pad",        # VDD  (1.2 V core supply)
    "g_iovss_pads\\[0\\].iovss_pad",    # IOVSS (3.3 V I/O ground)
    "g_iovdd_pads\\[0\\].iovdd_pad",    # IOVDD (3.3 V I/O supply)
    "g_inputs\\[0\\].input_pad",        # input_PAD[0]   = sel[0]
    "g_inputs\\[1\\].input_pad",        # input_PAD[1]   = sel[1]
    rst_n_pad,                          # rst_n
    clk_pad                             # clk
]

# North (left to right): count[7:0] of the selected counter, LSB first
PAD_NORTH: [
    "g_outputs\\[0\\].output_pad",      # output_PAD[0]  = count[0] (LSB)
    "g_outputs\\[1\\].output_pad",      # output_PAD[1]  = count[1]
    "g_outputs\\[2\\].output_pad",      # output_PAD[2]  = count[2]
    "g_outputs\\[3\\].output_pad",      # output_PAD[3]  = count[3]
    "g_outputs\\[4\\].output_pad",      # output_PAD[4]  = count[4]
    "g_outputs\\[5\\].output_pad",      # output_PAD[5]  = count[5]
    "g_outputs\\[6\\].output_pad",      # output_PAD[6]  = count[6]
    "g_bidirs\\[0\\].bidir_pad"         # bidir_PAD[0]   = count[7] (MSB), read back into the inverter
]

# South (left to right): VCO enable and tuning, the RF pair in GSSG, the VCO supply
PAD_SOUTH: [
    "g_inputs\\[2\\].input_pad",        # input_PAD[2]   = di_en
    "g_analogs\\[0\\].analog_pad",      # analog_PAD[0]  = vtune    (via padres)
    "g_vss_pads\\[1\\].vss_pad",        # VSS
    "g_rf_pads\\[0\\].rf_pad",          # rf_PAD[0]      = rf_out_n (RF pad, via padbare)
    "g_rf_pads\\[1\\].rf_pad",          # rf_PAD[1]      = rf_out_p (RF pad, via padbare)
    "g_vss_pads\\[2\\].vss_pad",        # VSS
    vdd_rf_pad,                         # vdd_rf_PAD     = VCO supply (via padbare)
    "g_vss_pads\\[3\\].vss_pad"         # VSS
]

# East (bottom to top): amplifier, inverter, ring oscillator, IHP HV counter supply
PAD_EAST: [
    "g_analogs\\[1\\].analog_pad",      # analog_PAD[1]  = amp_vin  (via padres)
    "g_analogs\\[2\\].analog_pad",      # analog_PAD[2]  = amp_vout (via padbare)
    "g_analogs\\[3\\].analog_pad",      # analog_PAD[3]  = inv_vin  (via padres)
    "g_analogs\\[4\\].analog_pad",      # analog_PAD[4]  = inv_vout (via padbare)
    "g_outputs\\[7\\].output_pad",      # output_PAD[7]  = inv_dout
    vdd_ro_pad,                         # vdd_ro_PAD     = ring oscillator supply (via padbare)
    "g_analogs\\[5\\].analog_pad",      # analog_PAD[5]  = ro_vout  (via padbare)
    vdd_hv_pad                          # vdd_hv_PAD     = IHP HV counter supply (via padbare)
]

# Pad spacing: each side offers 960 um between the corner cells for 8 x 80 um pads, leaving 320 um of fill.
# OpenROAD.PadRing floors the pad-to-pad gap to a multiple of PAD_SPACING_MULTIPLE and centers the row.
# The ideal gap between the 8 pads is fill / (pads + 1) = 320/9 = 35.56 um, floored to the multiple: gap = floor(35.56 / multiple) * multiple.
# With a multiple of 20 um: gap = floor(35.56/20)*20 = 20 um, so the pads sit on a 100 um pitch and the ends get (320 - 7*20)/2 = 90 um.
PAD_SPACING_MULTIPLE: 20

# SDC files
PNR_SDC_FILE:     dir::chip_top.sdc
SIGNOFF_SDC_FILE: dir::chip_top.sdc
FALLBACK_SDC:     dir::chip_top.sdc

# Power / ground nets
VDD_NETS: ["VDD"]
GND_NETS: ["VSS"]
VERILOG_POWER_DEFINE: "USE_POWER_PINS"

# Clock
CLOCK_PORT: clk_PAD
CLOCK_NET:  clk_pad/p2c

CLOCK_PERIOD: 20 # in ns == 50 MHz

# Floorplanning
FP_SIZING: absolute
DIE_AREA:  [0, 0, 1600, 1600]
CORE_AREA: [365, 365, 1235, 1235]

# Increase for more logic on your die
PL_TARGET_DENSITY_PCT: 10
GRT_ALLOW_CONGESTION:  true

# Bondpads
# Override bondpad name
PAD_BONDPAD_NAME: sg13cmos5l_ip__bondpad_70x70

EXTRA_GDS:
- dir::../../ip/sg13cmos5l_ip__bondpad_70x70/final/gds/sg13cmos5l_ip__bondpad_70x70.gds
- dir::../../ip/sg13cmos5l_ip__rfpad_70x70/final/gds/sg13cmos5l_ip__rfpad_70x70.gds

EXTRA_LEFS:
- dir::../../ip/sg13cmos5l_ip__bondpad_70x70/final/lef/sg13cmos5l_ip__bondpad_70x70.lef

IGNORE_DISCONNECTED_MODULES:
- sg13cmos5l_ip__bondpad_70x70
- sg13cmos5l_ip__jku
- sg13cmos5l_ip__jku_names

# PDN
PDN_CORE_RING: True

# Maximum metal width without slotting: 30um
PDN_CORE_RING_VWIDTH: 15
PDN_CORE_RING_HWIDTH: 15
# Ensure minimum spacing for long metals
PDN_CORE_RING_VSPACING: 5
PDN_CORE_RING_HSPACING: 5

PDN_CORE_RING_CONNECT_TO_PADS: True
PDN_ENABLE_PINS: False

# Because we have multiple power pads for one power domain
MAGIC_EXT_UNIQUE: notopports

# Custom PDN config
PDN_CFG: dir::pdn_cfg.tcl

# Keep the stripes off the VCO coil and the ring oscillator, and the TopMetal1 stripes out of the strip below the VCO,
# where pdn_cfg.tcl draws vdd_rf and the VCO VSS.
PDN_OBSTRUCTIONS:
- ["TopMetal1", 615, 366.66, 1070, 400]
- ["TopMetal1", 723.64, 380.14, 876.64, 567.04]
- ["Metal4", 723.64, 380.14, 876.64, 567.04]
- ["Metal4", 1070, 925, 1213.52, 950]

# Supplies of their own: these macro supply pins go to a power net of their own instead of the ring's VDD.
# The net names are those Odb.SetPowerConnections reads from the RTL, so it finds the pins already connected.
# pdn_cfg.tcl moves the padbare of each supply pad onto the same net and draws the straps between them.
PDN_MACRO_CONNECTIONS:
- "i_chip_core.vco i_chip_core.vdd_rf VSS VDD VSS"
- "i_chip_core.ringosc i_chip_core.vdd_ro VSS VDD VSS"
- "i_chip_core.counter_hv_kvc i_chip_core.vdd_hv VSS VDD VSS"

# Custom pad files for PADBARE, and the RF pad
PAD_LEFS:
- dir::../../ip/sg13cmos5l_io_custom/lef/sg13cmos5l_io.lef
- dir::../../ip/sg13cmos5l_ip__rfpad_70x70/final/lef/sg13cmos5l_ip__rfpad_70x70.lef
PAD_VERILOG_MODELS:
- dir::../../ip/sg13cmos5l_io_custom/verilog/sg13cmos5l_io.v
- dir::../../ip/sg13cmos5l_ip__rfpad_70x70/final/vh/sg13cmos5l_ip__rfpad_70x70.vh
# The RF pad carries its own bond pad and is 70 um taller than the IO cells, so pad_cfg.tcl moves it outward by the bond pad depth.
PAD_CFG: dir::pad_cfg.tcl
# place_bondpad creates the top-level terminal of every other pad, the RF pad gets no bondpad.
PAD_PLACE_IO_TERMINALS:
- sg13cmos5l_ip__rfpad_70x70/pad
# The PAD_LIBS of the PDK name three corners and stop OpenROAD.RepairDesignPostGPL with STA-1112 on the other three.
# The IO libraries are in LIB below.
PAD_LIBS: {}

# Technology LIBs
LIB:
  "*_fast_1p32V_m40C":
    - pdk_dir::libs.ref/sg13cmos5l_stdcell/lib/sg13cmos5l_stdcell_fast_1p32V_m40C.lib
    - dir::../../ip/sg13cmos5l_io_custom/lib/sg13cmos5l_io_fast_1p32V_3p6V_m40C.lib
    - dir::../../ip/sg13cmos5l_ip__rfpad_70x70/final/lib/sg13cmos5l_ip__rfpad_70x70.lib

  "*_fast_1p65V_m40C":
    - pdk_dir::libs.ref/sg13cmos5l_stdcell/lib/sg13cmos5l_stdcell_fast_1p65V_m40C.lib
    - dir::../../ip/sg13cmos5l_io_custom/lib/sg13cmos5l_io_fast_1p65V_3p6V_m40C.lib
    - dir::../../ip/sg13cmos5l_ip__rfpad_70x70/final/lib/sg13cmos5l_ip__rfpad_70x70.lib

  "*_slow_1p08V_125C":
    - pdk_dir::libs.ref/sg13cmos5l_stdcell/lib/sg13cmos5l_stdcell_slow_1p08V_125C.lib
    - dir::../../ip/sg13cmos5l_io_custom/lib/sg13cmos5l_io_slow_1p08V_3p0V_125C.lib
    - dir::../../ip/sg13cmos5l_ip__rfpad_70x70/final/lib/sg13cmos5l_ip__rfpad_70x70.lib

  "*_slow_1p35V_125C":
    - pdk_dir::libs.ref/sg13cmos5l_stdcell/lib/sg13cmos5l_stdcell_slow_1p35V_125C.lib
    - dir::../../ip/sg13cmos5l_io_custom/lib/sg13cmos5l_io_slow_1p35V_3p0V_125C.lib
    - dir::../../ip/sg13cmos5l_ip__rfpad_70x70/final/lib/sg13cmos5l_ip__rfpad_70x70.lib

  "*_typ_1p20V_25C":
    - pdk_dir::libs.ref/sg13cmos5l_stdcell/lib/sg13cmos5l_stdcell_typ_1p20V_25C.lib
    - dir::../../ip/sg13cmos5l_io_custom/lib/sg13cmos5l_io_typ_1p2V_3p3V_25C.lib
    - dir::../../ip/sg13cmos5l_ip__rfpad_70x70/final/lib/sg13cmos5l_ip__rfpad_70x70.lib

  "*_typ_1p50V_25C":
    - pdk_dir::libs.ref/sg13cmos5l_stdcell/lib/sg13cmos5l_stdcell_typ_1p50V_25C.lib
    - dir::../../ip/sg13cmos5l_io_custom/lib/sg13cmos5l_io_typ_1p5V_3p3V_25C.lib
    - dir::../../ip/sg13cmos5l_ip__rfpad_70x70/final/lib/sg13cmos5l_ip__rfpad_70x70.lib

# Corners
STA_CORNERS:
  - nom_fast_1p32V_m40C
  - nom_fast_1p65V_m40C
  - nom_slow_1p08V_125C
  - nom_slow_1p35V_125C
  - nom_typ_1p20V_25C
  - nom_typ_1p50V_25C

# The TO signs off at VDD = 1.2 V
DEFAULT_CORNER: nom_typ_1p20V_25C

# Limit detailed routing to 10 iterations
# DRT_OPT_ITERS: 10

# Non-Default Rules (NDRs) for the following analog traces
# Note for the AUTO_TAPER_NDR_NETS variable:
# OpenROAD needs to be recompiled with the following patch when the AUTO_TAPER_NDR_NETS variable is changed from true (default) to false:
# https://github.com/FPGA-Research/heichips25-tapeout/blob/main/nix/disable_auto_taper.patch
# The AUTO_TAPER_NDR_NETS variable tells the detailed router whether it is allowed to automatically "shrink" those wide NDR wires to fit onto small pins.
# When Enabled (1 or true - Default): The router will automatically taper the wide wire down to the minimum width of the pin's metal layer as it makes the final connection.
# When Disabled (0 or false): The router will attempt to maintain the full NDR width all the way into the pin.
# Pending issue to change AUTO_TAPER_NDR_NETS in the LibreLane `config.yaml`: https://github.com/The-OpenROAD-Project/OpenROAD/issues/10032
NON_DEFAULT_RULES:
  # Rules for analog traces (amplifier, inverter and ring oscillator inputs and outputs, vtune).
  # 0.5 um width and 0.5 um spacing on Metal1 through Metal4.
  NDR_analog:
    width:   [Metal1, "0.5", Metal2, "0.5", Metal3, "0.5", Metal4, "0.5"]
    spacing: [Metal1, "0.5", Metal2, "0.5", Metal3, "0.5", Metal4, "0.5"]
    via:     ["Via1_DC1B", "Via2_DC1B", "Via3_DC1B"]

# Apply NDRs to analog traces during detailed routing
DRT_ASSIGN_NDR:
  "^.*analog_PADRES.*$":  NDR_analog
  "^.*analog_PADBARE.*$": NDR_analog

# Do not touch analog traces --> no optimization or buffering
RSZ_DONT_TOUCH_LIST:
- "analog_PADRES[0]"
- "analog_PADRES[1]"
- "analog_PADRES[3]"
- "analog_PADBARE[2]"
- "analog_PADBARE[4]"
- "analog_PADBARE[5]"
- "i_chip_core.rf_out_n"
- "i_chip_core.rf_out_p"

MACROS:
  # ----------------------------------------------------------------
  # counter_lv_ihp_top: IHP LV standard cells
  # ----------------------------------------------------------------
  counter_lv_ihp_top:
    gds:
      - dir::../../macros/counter_lv_ihp/final/gds/counter_lv_ihp_top.gds
    lef:
      - dir::../../macros/counter_lv_ihp/final/lef/counter_lv_ihp_top.lef
    pnl:
      - dir::../../macros/counter_lv_ihp/final/pnl/counter_lv_ihp_top.pnl.v
    nl:
      - dir::../../macros/counter_lv_ihp/final/nl/counter_lv_ihp_top.nl.v
    spef:
      nom_*: dir::../../macros/counter_lv_ihp/final/spef/nom/counter_lv_ihp_top.nom.spef
    lib:
      nom_fast_1p32V_m40C: dir::../../macros/counter_lv_ihp/final/lib/nom_fast_1p32V_m40C/counter_lv_ihp_top__nom_fast_1p32V_m40C.lib
      nom_fast_1p65V_m40C: dir::../../macros/counter_lv_ihp/final/lib/nom_fast_1p65V_m40C/counter_lv_ihp_top__nom_fast_1p65V_m40C.lib
      nom_slow_1p08V_125C: dir::../../macros/counter_lv_ihp/final/lib/nom_slow_1p08V_125C/counter_lv_ihp_top__nom_slow_1p08V_125C.lib
      nom_slow_1p35V_125C: dir::../../macros/counter_lv_ihp/final/lib/nom_slow_1p35V_125C/counter_lv_ihp_top__nom_slow_1p35V_125C.lib
      nom_typ_1p20V_25C:   dir::../../macros/counter_lv_ihp/final/lib/nom_typ_1p20V_25C/counter_lv_ihp_top__nom_typ_1p20V_25C.lib
      nom_typ_1p50V_25C:   dir::../../macros/counter_lv_ihp/final/lib/nom_typ_1p50V_25C/counter_lv_ihp_top__nom_typ_1p50V_25C.lib
    instances:
      # left in the top row
      i_chip_core.counter_lv_ihp:
        location: ["expr::$DIE_AREA[2] / 2 - 100 - 260", "expr::365 + 730"]
        orientation: N
  # ----------------------------------------------------------------
  # counter_lv_eth_top: ETH LV standard cells, Liberty up to 1.32 V only, so the 1.35 V to 1.65 V corners reuse the nearest one
  # ----------------------------------------------------------------
  counter_lv_eth_top:
    gds:
      - dir::../../macros/counter_lv_eth/final/gds/counter_lv_eth_top.gds
    lef:
      - dir::../../macros/counter_lv_eth/final/lef/counter_lv_eth_top.lef
    pnl:
      - dir::../../macros/counter_lv_eth/final/pnl/counter_lv_eth_top.pnl.v
    nl:
      - dir::../../macros/counter_lv_eth/final/nl/counter_lv_eth_top.nl.v
    spef:
      nom_*: dir::../../macros/counter_lv_eth/final/spef/nom/counter_lv_eth_top.nom.spef
    lib:
      nom_fast_1p32V_m40C: dir::../../macros/counter_lv_eth/final/lib/nom_fast_1p32V_m40C/counter_lv_eth_top__nom_fast_1p32V_m40C.lib
      nom_fast_1p65V_m40C: dir::../../macros/counter_lv_eth/final/lib/nom_fast_1p32V_m40C/counter_lv_eth_top__nom_fast_1p32V_m40C.lib
      nom_slow_1p08V_125C: dir::../../macros/counter_lv_eth/final/lib/nom_slow_1p08V_125C/counter_lv_eth_top__nom_slow_1p08V_125C.lib
      nom_slow_1p35V_125C: dir::../../macros/counter_lv_eth/final/lib/nom_slow_1p08V_125C/counter_lv_eth_top__nom_slow_1p08V_125C.lib
      nom_typ_1p20V_25C:   dir::../../macros/counter_lv_eth/final/lib/nom_typ_1p20V_25C/counter_lv_eth_top__nom_typ_1p20V_25C.lib
      nom_typ_1p50V_25C:   dir::../../macros/counter_lv_eth/final/lib/nom_typ_1p20V_25C/counter_lv_eth_top__nom_typ_1p20V_25C.lib
    instances:
      # x-centered in the top row
      i_chip_core.counter_lv_eth:
        location: ["expr::$DIE_AREA[2] / 2 - 100", "expr::365 + 730"]
        orientation: N
  # ----------------------------------------------------------------
  # counter_hv_kvc_top: IHP HV standard cells on vdd_hv, Liberty at 3.0 V and above only, so chip STA cannot judge them at 1.2 V to 1.65 V
  # ----------------------------------------------------------------
  counter_hv_kvc_top:
    gds:
      - dir::../../macros/counter_hv_kvc/final/gds/counter_hv_kvc_top.gds
    lef:
      - dir::../../macros/counter_hv_kvc/final/lef/counter_hv_kvc_top.lef
    pnl:
      - dir::../../macros/counter_hv_kvc/final/pnl/counter_hv_kvc_top.pnl.v
    nl:
      - dir::../../macros/counter_hv_kvc/final/nl/counter_hv_kvc_top.nl.v
    spef:
      nom_*: dir::../../macros/counter_hv_kvc/final/spef/nom/counter_hv_kvc_top.nom.spef
    lib:
      nom_fast_1p32V_m40C: dir::../../macros/counter_hv_kvc/final/lib/nom_fast_3p60V_m40C/counter_hv_kvc_top__nom_fast_3p60V_m40C.lib
      nom_fast_1p65V_m40C: dir::../../macros/counter_hv_kvc/final/lib/nom_fast_3p60V_m40C/counter_hv_kvc_top__nom_fast_3p60V_m40C.lib
      nom_slow_1p08V_125C: dir::../../macros/counter_hv_kvc/final/lib/nom_slow_3p00V_125C/counter_hv_kvc_top__nom_slow_3p00V_125C.lib
      nom_slow_1p35V_125C: dir::../../macros/counter_hv_kvc/final/lib/nom_slow_3p00V_125C/counter_hv_kvc_top__nom_slow_3p00V_125C.lib
      nom_typ_1p20V_25C:   dir::../../macros/counter_hv_kvc/final/lib/nom_typ_3p30V_25C/counter_hv_kvc_top__nom_typ_3p30V_25C.lib
      nom_typ_1p50V_25C:   dir::../../macros/counter_hv_kvc/final/lib/nom_typ_3p30V_25C/counter_hv_kvc_top__nom_typ_3p30V_25C.lib
    instances:
      # right in the top row
      i_chip_core.counter_hv_kvc:
        location: ["expr::$DIE_AREA[2] / 2 - 100 + 260", "expr::365 + 730"]
        orientation: N
  # ----------------------------------------------------------------
  # inverter_top: channel 1 analog, channel 4 digital
  # ----------------------------------------------------------------
  inverter_top:
    gds:
      - dir::../../macros/inverter/final/gds/inverter_top.gds
    lef:
      - dir::../../macros/inverter/final/lef/inverter_top.lef
    vh:
      - dir::../../macros/inverter/final/vh/inverter_top.vh
    instances:
      # east of the core, in front of the inverter pads
      i_chip_core.inverter:
        location: [1080, 684.18]
        orientation: N
  # ----------------------------------------------------------------
  # amplifier: resistive-feedback amplifier
  # ----------------------------------------------------------------
  amplifier:
    gds:
      - dir::../../macros/amplifier/final/gds/amplifier.gds
    lef:
      - dir::../../macros/amplifier/final/lef/amplifier.lef
    vh:
      - dir::../../macros/amplifier/final/vh/amplifier.vh
    instances:
      # south-east, in front of the amplifier pads
      i_chip_core.amplifier:
        location: [1150, 490]
        orientation: N
  # ----------------------------------------------------------------
  # ringosc: ring oscillator on vdd_ro
  # ----------------------------------------------------------------
  ringosc:
    gds:
      - dir::../../macros/ringosc/final/gds/ringosc.gds
    lef:
      - dir::../../macros/ringosc/final/lef/ringosc.lef
    vh:
      - dir::../../macros/ringosc/final/vh/ringosc.vh
    instances:
      # east, in front of its supply and output pads
      i_chip_core.ringosc:
        # y puts its VDD pin under the vdd_ro strap and its VSS pin above the strap to the VSS stripe, see pdn_cfg.tcl
        location: [1075, 929.88]
        orientation: N
  # ----------------------------------------------------------------
  # vco_top: 20 GHz VCO on vdd_rf
  # ----------------------------------------------------------------
  vco_top:
    gds:
      - dir::../../macros/vco/final/gds/vco_top.gds
    lef:
      - dir::../../macros/vco/final/lef/vco_top.lef
