#--------------------------------------------------------------
# CACE circuit characterization file
#--------------------------------------------------------------

name:           ringosc
description:    Three-stage ring oscillator macro with output buffer on the ihp-sg13cmos5l Open-PDK
PDK:            ihp-sg13cmos5l

cace_format:    5.2

authorship:
  designer:         Simon Dorrer
  company:          Johannes Kepler University
  creation_date:    November 7, 2026
  license:          Apache-2.0 WITH SHL-2.1

paths:
  root:             ..
  schematic:        ../schematic/xschem
  netlist:          cace/netlist
  documentation:    cace/_docs
  runs:             cace/_runs

pins:
  VDD:
    description: Positive analog power supply
    type: power
    direction: inout
    Vmin: 1.35
    Vmax: 1.65
  VSS:
    description: Analog ground
    type: ground
    direction: inout
  vout:
    description: Buffered oscillator output
    type: signal
    direction: output

default_conditions:
  vdd:
    description: Analog power supply voltage
    display: VDD
    unit: V
    typical: 1.5
  corner_mos:
    description: Process corner MOSFET
    display: Corner MOSFET
    typical: tt
  corner_r:
    description: Process corner resistor
    display: Corner R
    typical: typ
  temp:
    description: Ambient temperature
    display: Temperature
    unit: °C
    typical: 27
  cload:
    description: Load capacitance
    display: Cload
    unit: pF
    typical: 0.1

parameters:
  tran_params:
    spec:
      fosc:
        display: Oscillation frequency
        description: Oscillation frequency, averaged over 20 periods after start-up
        unit: Hz
        minimum:
          value: 225000000
        typical:
          value: any
        maximum:
          value: any
      Idd:
        display: Average supply current
        description: Average supply current over the same 20 periods
        unit: A
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 0.0045
    tool:
      ngspice:
        template: ringosc_tb_tran.sch
        format: ascii
        suffix: .data
        variables: [fosc, Idd]
    plot:
      fosc_vs_vdd:
        type: xyplot
        xaxis: vdd
        yaxis: fosc
        limits: auto
      fosc_vs_corner_mos:
        type: xyplot
        xaxis: corner_mos
        yaxis: fosc
        limits: auto
      fosc_vs_temp:
        type: xyplot
        xaxis: temp
        yaxis: fosc
        limits: auto
      fosc_vs_cload:
        type: xyplot
        xaxis: cload
        yaxis: fosc
        limits: auto
      Idd_vs_vdd:
        type: xyplot
        xaxis: vdd
        yaxis: Idd
        limits: auto
      Idd_vs_corner_mos:
        type: xyplot
        xaxis: corner_mos
        yaxis: Idd
        limits: auto
      Idd_vs_temp:
        type: xyplot
        xaxis: temp
        yaxis: Idd
        limits: auto
      Idd_vs_cload:
        type: xyplot
        xaxis: cload
        yaxis: Idd
        limits: auto
    conditions:
      vdd:
        minimum: 1.35
        typical: 1.5
        maximum: 1.65
      corner_mos:
        enumerate: [ss, sf, tt, fs, ff]
        # typical: tt
      corner_r:
        typical: typ
      temp:
        #minimum: 0
        typical: 27
        #maximum: 70
      cload:
        typical: 0.1

  tran_mc_params:
    spec:
      fosc:
        display: Oscillation frequency - Monte Carlo
        description: Oscillation frequency, averaged over 20 periods after start-up
        unit: Hz
        minimum:
          value: 225000000
        typical:
          value: any
        maximum:
          value: any
      Idd:
        display: Average supply current - Monte Carlo
        description: Average supply current over the same 20 periods
        unit: A
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 0.0045
    tool:
      ngspice:
        template: ringosc_tb_tran.sch
        collate: iterations
        format: ascii
        suffix: .data
        variables: [fosc, Idd]
        script: ringosc_tb_tran.py
        script_variables: [fosc_arr, Idd_arr]
    plot:
      fosc_mc:
        type: histogram
        xaxis: fosc_arr
      Idd_mc:
        type: histogram
        xaxis: Idd_arr
    conditions:
      vdd:
        #minimum: 1.35
        typical: 1.5
        #maximum: 1.65
      iterations: # for Monte Carlo
        description: Iterations to run
        display: Iterations
        minimum: 1
        maximum: 200
        step: linear
        stepsize: 1
      corner_mos:
        typical: tt_stat    # Process variation Monte Carlo
      corner_r:
        typical: stat
      temp:
        #minimum: 0
        typical: 27
        #maximum: 70
      cload:
        typical: 0.1

  tran_mm_params:
    spec:
      fosc:
        display: Oscillation frequency - Mismatch
        description: Oscillation frequency, averaged over 20 periods after start-up
        unit: Hz
        minimum:
          value: 225000000
        typical:
          value: any
        maximum:
          value: any
      Idd:
        display: Average supply current - Mismatch
        description: Average supply current over the same 20 periods
        unit: A
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: 0.0045
    tool:
      ngspice:
        template: ringosc_tb_tran.sch
        collate: iterations
        format: ascii
        suffix: .data
        variables: [fosc, Idd]
        script: ringosc_tb_tran.py
        script_variables: [fosc_arr, Idd_arr]
    plot:
      fosc_mm:
        type: histogram
        xaxis: fosc_arr
      Idd_mm:
        type: histogram
        xaxis: Idd_arr
    conditions:
      vdd:
        #minimum: 1.35
        typical: 1.5
        #maximum: 1.65
      iterations: # for Mismatch
        description: Iterations to run
        display: Iterations
        minimum: 1
        maximum: 200
        step: linear
        stepsize: 1
      corner_mos:
        typical: tt_mismatch
        # typical: ss_mismatch
        # typical: ff_mismatch
        # typical: sf_mismatch
      corner_r:
        typical: typ_mismatch
      temp:
        #minimum: 0
        typical: 27
        #maximum: 70
      cload:
        typical: 0.1
