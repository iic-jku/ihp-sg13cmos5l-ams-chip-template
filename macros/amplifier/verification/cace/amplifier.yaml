#--------------------------------------------------------------
# CACE circuit characterization file
#--------------------------------------------------------------

name:           amplifier
description:    Self-biased inverter amplifier macro on the ihp-sg13cmos5l Open-PDK
PDK:            ihp-sg13cmos5l

cace_format:    5.2

authorship:
  designer:         Simon Dorrer
  company:          Johannes Kepler University
  creation_date:    November 7, 2026
  license:          Apache-2.0 WITH SHL-2.1

paths:
  root:             ..
  schematic:        ../schematic/xschem
  netlist:          cace/netlist
  documentation:    cace/_docs
  runs:             cace/_runs

pins:
  VDD:
    description: Positive analog power supply
    type: power
    direction: inout
    Vmin: 1.35
    Vmax: 1.65
  VSS:
    description: Analog ground
    type: ground
    direction: inout
  vin:
    description: Amplifier input
    type: signal
    direction: input
  vout:
    description: Amplifier output
    type: signal
    direction: output

default_conditions:
  vdd:
    description: Analog power supply voltage
    display: VDD
    unit: V
    typical: 1.5
  corner_mos:
    description: Process corner MOSFET
    display: Corner MOSFET
    typical: tt
  corner_r:
    description: Process corner resistor
    display: Corner R
    typical: typ
  temp:
    description: Ambient temperature
    display: Temperature
    unit: °C
    typical: 27
  cload:
    description: Load capacitance
    display: Cload
    unit: pF
    typical: 10

parameters:
  ac_params:
    spec:
      Av_dB:
        display: Voltage gain
        description: Small-signal gain vout/vin at 10Hz, input AC coupled, DC point set by the feedback rhigh
        unit: dB
        minimum:
          value: 30
        typical:
          value: any
        maximum:
          value: any
      fcu:
        display: Upper -3dB cut-off frequency
        description: Upper -3dB cut-off frequency
        unit: Hz
        minimum:
          value: 1500000
        typical:
          value: any
        maximum:
          value: any
    tool:
      ngspice:
        template: amplifier_tb_ac.sch
        format: ascii
        suffix: .data
        variables: [Av_dB, fcu]
    plot:
      Av_dB_vs_vdd:
        type: xyplot
        xaxis: vdd
        yaxis: Av_dB
        limits: auto
      Av_dB_vs_corner_mos:
        type: xyplot
        xaxis: corner_mos
        yaxis: Av_dB
        limits: auto
      Av_dB_vs_temp:
        type: xyplot
        xaxis: temp
        yaxis: Av_dB
        limits: auto
      Av_dB_vs_cload:
        type: xyplot
        xaxis: cload
        yaxis: Av_dB
        limits: auto
      fcu_vs_vdd:
        type: xyplot
        xaxis: vdd
        yaxis: fcu
        limits: auto
      fcu_vs_corner_mos:
        type: xyplot
        xaxis: corner_mos
        yaxis: fcu
        limits: auto
      fcu_vs_temp:
        type: xyplot
        xaxis: temp
        yaxis: fcu
        limits: auto
      fcu_vs_cload:
        type: xyplot
        xaxis: cload
        yaxis: fcu
        limits: auto
    conditions:
      vdd:
        minimum: 1.35
        typical: 1.5
        maximum: 1.65
      corner_mos:
        enumerate: [ss, sf, tt, fs, ff]
        # typical: tt
      corner_r:
        typical: typ
      temp:
        #minimum: 0
        typical: 27
        #maximum: 70
      cload:
        typical: 10

  ac_mc_params:
    spec:
      Av_dB:
        display: Voltage gain - Monte Carlo
        description: Small-signal gain vout/vin at 10Hz, input AC coupled, DC point set by the feedback rhigh
        unit: dB
        minimum:
          value: 30
        typical:
          value: any
        maximum:
          value: any
      fcu:
        display: Upper -3dB cut-off frequency - Monte Carlo
        description: Upper -3dB cut-off frequency
        unit: Hz
        minimum:
          value: 1500000
        typical:
          value: any
        maximum:
          value: any
    tool:
      ngspice:
        template: amplifier_tb_ac.sch
        collate: iterations
        format: ascii
        suffix: .data
        variables: [Av_dB, fcu]
        script: amplifier_tb_ac.py
        script_variables: [Av_dB_arr, fcu_arr]
    plot:
      Av_dB_mc:
        type: histogram
        xaxis: Av_dB_arr
      fcu_mc:
        type: histogram
        xaxis: fcu_arr
    conditions:
      vdd:
        #minimum: 1.35
        typical: 1.5
        #maximum: 1.65
      iterations: # for Monte Carlo
        description: Iterations to run
        display: Iterations
        minimum: 1
        maximum: 200
        step: linear
        stepsize: 1
      corner_mos:
        typical: tt_stat    # Process variation Monte Carlo
      corner_r:
        typical: stat
      temp:
        #minimum: 0
        typical: 27
        #maximum: 70
      cload:
        typical: 10

  ac_mm_params:
    spec:
      Av_dB:
        display: Voltage gain - Mismatch
        description: Small-signal gain vout/vin at 10Hz, input AC coupled, DC point set by the feedback rhigh
        unit: dB
        minimum:
          value: 30
        typical:
          value: any
        maximum:
          value: any
      fcu:
        display: Upper -3dB cut-off frequency - Mismatch
        description: Upper -3dB cut-off frequency
        unit: Hz
        minimum:
          value: 1500000
        typical:
          value: any
        maximum:
          value: any
    tool:
      ngspice:
        template: amplifier_tb_ac.sch
        collate: iterations
        format: ascii
        suffix: .data
        variables: [Av_dB, fcu]
        script: amplifier_tb_ac.py
        script_variables: [Av_dB_arr, fcu_arr]
    plot:
      Av_dB_mm:
        type: histogram
        xaxis: Av_dB_arr
      fcu_mm:
        type: histogram
        xaxis: fcu_arr
    conditions:
      vdd:
        #minimum: 1.35
        typical: 1.5
        #maximum: 1.65
      iterations: # for Mismatch
        description: Iterations to run
        display: Iterations
        minimum: 1
        maximum: 200
        step: linear
        stepsize: 1
      corner_mos:
        typical: tt_mismatch
        # typical: ss_mismatch
        # typical: ff_mismatch
        # typical: sf_mismatch
      corner_r:
        typical: typ_mismatch
      temp:
        #minimum: 0
        typical: 27
        #maximum: 70
      cload:
        typical: 10
