meta:
  version: 3
  flow: Classic
  substituting_steps:

    # Magic reports some overlaps which can be ignored
    Checker.IllegalOverlap: null

    "+OpenROAD.DetailedRouting": "Odb.InsertECOBuffers"
    "+Odb.InsertECOBuffers": "OpenROAD.DetailedRouting"

INSERT_ECO_BUFFERS:
  # === East Pads ===
  # - target: output19/X # enable_i
  # buffer: BUFX12
  # === END OF ECO_BUFFERS ===
    
DESIGN_NAME: counter_lv_eth_top
VERILOG_FILES: ["dir::../../rtl/constants.sv",
"dir::../../rtl/counter_lv_eth.sv",
"dir::../../rtl/counter_lv_eth_top.sv"]

# Enable plugin for better SystemVerilog support
# USE_SLANG: True

# The sg13cmos5l PDK already defaults to KLayout for GDS streamout
# PRIMARY_GDSII_STREAMOUT_TOOL: klayout

# Layout / Floorplan Rules
DIE_AREA: [0, 0, 200, 100]
PL_TARGET_DENSITY_PCT: 40
GRT_ALLOW_CONGESTION: true
RUN_MAGIC_DRC: true
RUN_CTS: true

# Valid values are AREA 0-3 and DELAY 0-4, LibreLane defaults to AREA 0
# DELAY favours speed, AREA favours cell area
# AREA 3 and DELAY 4 always add buffering and gate sizing, so AREA 3 can be larger than AREA 0
SYNTH_STRATEGY: DELAY 4
# MAX_FANOUT_CONSTRAINT: 6
# RT_MAX_LAYER: Metal4
FP_PIN_ORDER_CFG: dir::pin_order.cfg
FP_PDN_MULTILAYER: false
FP_SIZING: absolute

# SDC files
PNR_SDC_FILE: dir::impl.sdc
SIGNOFF_SDC_FILE: dir::signoff.sdc

# Power / ground nets
VDD_NETS: ["VDD"]
GND_NETS: ["VSS"]
VERILOG_POWER_DEFINE: "USE_POWER_PINS"

# Clock
CLOCK_PORT: clock_i
CLOCK_NET: clock_i
CLOCK_PERIOD: 20 # in ns == 50 MHz

# Define Standard Cells
# The name stays at the PDK default, every view it implies is replaced below
STD_CELL_LIBRARY: sg13cmos5l_stdcell

# Views
TECH_LEFS:
  "*": pdk_dir::../ihp-sg13g2/libs.ref/ez130_8t/lef/ez130_sg13cmos5l_tech.lef
CELL_LEFS: [pdk_dir::../ihp-sg13g2/libs.ref/ez130_8t/lef/ez130_8t.lef]
CELL_GDS: [pdk_dir::../ihp-sg13g2/libs.ref/ez130_8t/gds/ez130_8t.gds]
CELL_VERILOG_MODELS: [pdk_dir::../ihp-sg13g2/libs.ref/ez130_8t/verilog/ez130_8t.v]
CELL_SPICE_MODELS: [pdk_dir::../ihp-sg13g2/libs.ref/ez130_8t/cdl/ez130_8t.cdl]
CELL_CDLS: [pdk_dir::../ihp-sg13g2/libs.ref/ez130_8t/cdl/ez130_8t.cdl]
FP_TRACKS_INFO: dir::tracks_ez130.info

# Well and substrate ties
WELLTAP_CELL: WELLTAP
FP_TAPCELL_DIST: 20

# Role cells, matched to the IHP LV defaults on max_capacitance
SYNTH_DRIVING_CELL: BUFX12/Y
SYNTH_CLK_DRIVING_CELL: BUFX12/Y
SYNTH_BUFFER_CELL: BUFX3/A/Y
SYNTH_TIEHI_CELL: TIEHI/Y
SYNTH_TIELO_CELL: TIELO/Y
FILL_CELLS: [FILLER1, FILLER2, FILLER4, FILLER8, FILLER16]
DECAP_CELLS: [DECAP4, DECAP8, DECAP16, DECAP32]
CELL_PAD_EXCLUDE: ["FILLER*", "DECAP*"]
TRISTATE_CELLS: ["TBUFX*", "TINVX*"]
DIODE_CELL: ANTENNA2/A
PDN_RAIL_WIDTH: 0.32
CTS_ROOT_BUFFER: BUFX24
CTS_CLK_BUFFERS: [BUFX24, BUFX12, BUFX6, BUFX3]

# Technology LIBs
LIB:
  "*_fast_1p32V_m40C":
    - pdk_dir::../ihp-sg13g2/libs.ref/ez130_8t/lib/ez130_8t_ff_1p32v_m40c.lib

  "*_slow_1p08V_125C":
    - pdk_dir::../ihp-sg13g2/libs.ref/ez130_8t/lib/ez130_8t_ss_1p08v_125c.lib

  "*_typ_1p20V_25C":
    - pdk_dir::../ihp-sg13g2/libs.ref/ez130_8t/lib/ez130_8t_tt_1p20v_25c.lib

# Corners
STA_CORNERS:
  - nom_fast_1p32V_m40C
  - nom_slow_1p08V_125C
  - nom_typ_1p20V_25C

DEFAULT_CORNER: nom_typ_1p20V_25C

# The macro has no pads. The PAD_LIBS of the PDK name three corners and can stop the run: STA-1112 on a corner they miss, a gzip note in stat.json on a corner they match
PAD_LIBS: {}

# Fix setup violations
# PL_RESIZER_SETUP_SLACK_MARGIN: 0.60
# GRT_RESIZER_SETUP_SLACK_MARGIN: 0.55

# Fix hold violations
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.05
PL_RESIZER_HOLD_SLACK_MARGIN: 0.1
PL_RESIZER_HOLD_MAX_BUFFER_PCT: 100
